server:
  port: 8080
  # Reduz de 200 (default) - cada thread reserva stack de memoria mesmo ociosa,
  # e o plano free do Render (512MB) nao aguenta o default em produção.
  tomcat:
    threads:
      max: 30
      min-spare: 4

spring:
  application:
    name: sorria-crm-backend
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:sorria}?sslmode=${DB_SSLMODE:disable}
    username: ${DB_USER:sorria}
    password: ${DB_PASSWORD:sorria}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 6MB
      max-request-size: 6MB

app:
  jwt:
    secret: ${JWT_SECRET:troque-este-segredo-em-producao-min-32-chars}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origin: ${CORS_ALLOWED_ORIGIN:http://localhost:5173}
  # URL publica deste backend, usada pra montar o webhook de cada instancia
  # nova da Evolution (".../api/whatsapp/webhook?numeroId=X") - ver
  # WhatsAppNumeroService.criar. O numero principal foi configurado assim
  # manualmente por fora antes disso existir.
  backend-url: ${BACKEND_URL:https://sorria-backend.onrender.com}

evolution:
  base-url: ${EVOLUTION_API_URL:}
  instance: ${EVOLUTION_INSTANCE:}
  api-key: ${EVOLUTION_API_KEY:}
  # So usada pra GET /instance/all (descobrir o numero conectado, campo "Telefone"
  # em Configuracoes) - o token de instancia acima nao tem permissao nesse endpoint.
  # Sem essa env var, o telefone so nao aparece sincronizado (nao quebra nada).
  # Tambem usada agora pra criar instancia nova (POST /instance/create) ao
  # cadastrar um numero secundario direto pelo app - ver WhatsAppNumeroService.
  global-api-key: ${EVOLUTION_GLOBAL_API_KEY:}

# Storage do Supabase pra foto de perfil dos colaboradores. Sem essas duas env vars
# configuradas no Render, o upload responde 400 com uma mensagem explicando o motivo
# em vez de quebrar (ver AvatarService).
supabase:
  url: ${SUPABASE_URL:}
  service-key: ${SUPABASE_SERVICE_KEY:}
  avatar-bucket: ${SUPABASE_AVATAR_BUCKET:avatars}

management:
  endpoints:
    web:
      exposure:
        include: health
